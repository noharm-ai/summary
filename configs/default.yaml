    args:
      api_key: ${env:MARITACA_API_KEY}
      base_url: "https://chat.maritaca.ai/api"
      model: "sabia-4"
      streaming: false
      extra_body:
        web_search: true

  # Note: data_ocean / code_execution are only supported on sabia-4-thinking,
  # not on plain sabia-4 (the API returns tool_not_supported_for_model). Only
  # web_search works on sabia-4.

  sabia_4_thinking_ctrl:
